[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow-telegram-importer"
version = "0.1.0"
description = "Private Telegram-to-filesystem importer for TaskFlow"
requires-python = ">=3.12"
dependencies = [
  "python-telegram-bot==22.8",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
taskflow-telegram-importer = "taskflow_telegram_importer.app:main"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

