telegram:
  api_id: 12345678
  api_hash: "replace-with-telegram-api-hash"
  bot_token: "replace-with-botfather-token"
  session_path: "/mnt/shared/customprograms/taskflow-telegram-importer/state/importer"
  progress_refresh_seconds: 30
  max_concurrent_downloads: 2
  allowed_user_ids: []

taskflow:
  webui_url: "https://taskflow.example.com/ui/telegram-ui/"

paths:
  staging: "/mnt/shared/DOWNLOADS/TaskFlow/telegram_staging"
  gate: "/mnt/shared/DOWNLOADS/TaskFlow/gate_local_media"
  log_file: "/mnt/shared/customprograms/taskflow-telegram-importer/logs/importer.log"

files:
  allowed_extensions:
    - ".mkv"
    - ".mp4"
    - ".avi"
    - ".mov"
    - ".m4v"
  minimum_free_gib: 400

logging:
  level: "INFO"

