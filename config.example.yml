telegram:
  api_id: 12345678
  api_hash: "replace-with-telegram-api-hash"
  bot_token: "replace-with-botfather-token"
  session_path: "/mnt/shared/customprograms/taskflow-telegram-importer/state/importer"
  progress_refresh_seconds: 30
  max_concurrent_downloads: 2
  allowed_user_ids: []

taskflow:
  webui_url: "https://taskflow.example.com/ui/telegram-ui/"
  api_base_url: "https://taskflow.example.com/api/v1"
  api_token: "replace-with-taskflow-admin-token"
  filesystem_integration_code: "local-media"
  request_timeout_seconds: 30
  reconciliation_poll_seconds: 2
  reconciliation_timeout_seconds: 120

tmdb:
  api_base_url: "https://api.themoviedb.org/3"
  api_key: "replace-with-tmdb-api-key"
  language: "it-IT"
  request_timeout_seconds: 30
  max_results: 5

episode_patterns:
  - token_regex: '(?i)(?<![A-Za-z0-9])S(?P<season>\d{1,2})E(?P<first>\d{1,3})(?:(?P<repeated>(?:E\d{1,3})+)|-(?:(?:S(?P<last_season>\d{1,2}))?E)(?P<last>\d{1,3}))?(?![A-Za-z0-9]|-(?:E\d|S\d{1,2}E))'
    item_regex: '(?i)E(?P<episode>\d{1,3})'
  - token_regex: '(?i)(?<![A-Za-z0-9])(?P<season>\d{1,2})x(?P<first>\d{1,3})(?P<repeated>(?:x\d{1,3})+)?(?![A-Za-z0-9])'
    item_regex: '(?i)x(?P<episode>\d{1,3})'

paths:
  staging: "/mnt/shared/DOWNLOADS/TaskFlow/telegram_staging"
  gate: "/mnt/shared/DOWNLOADS/TaskFlow/gate_local_media"
  log_file: "/mnt/shared/customprograms/taskflow-telegram-importer/logs/importer.log"

files:
  allowed_extensions:
    - ".mkv"
    - ".mp4"
    - ".avi"
    - ".mov"
    - ".m4v"
  minimum_free_gib: 400

logging:
  level: "INFO"

